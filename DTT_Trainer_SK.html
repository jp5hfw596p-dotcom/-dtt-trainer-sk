<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>DTT Trainer SK</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;background:white}.top{background:#111827;color:white;padding:22px 20px 18px}
h1{margin:0;font-size:25px}.sub{opacity:.75;margin-top:5px}.content{padding:20px}
.card{border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #00000008}
button{width:100%;border:0;border-radius:14px;padding:15px;margin:7px 0;font-size:16px;font-weight:700;background:#111827;color:white}
button.secondary{background:#e5e7eb;color:#111827}.answer{text-align:left;background:#f9fafb;color:#111827;border:1px solid #e5e7eb}.answer.correct{background:#dcfce7;border-color:#22c55e}.answer.wrong{background:#fee2e2;border-color:#ef4444}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e5e7eb;font-size:13px}.progress{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#111827;width:0}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.muted{color:#6b7280}.hidden{display:none}.big{font-size:40px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>🚗 DTT Trainer SK</h1><div class="sub">Írsky Driving Theory Test – slovenský tréning</div></header>
<main class="content" id="app"></main>
</div>
<script>
const questions=[
 {q:"Čo znamená červené svetlo na semafore?",a:["Musíte zastaviť.","Môžete pokračovať, ak je cesta voľná.","Musíte zrýchliť."],c:0,e:"Červené svetlo znamená, že musíte zastaviť pred stop čiarou."},
 {q:"Čo by ste mali urobiť pred zmenou jazdného pruhu?",a:["Skontrolovať zrkadlá, mŕtvy uhol a dať znamenie.","Okamžite prejsť do druhého pruhu.","Použiť iba klaksón."],c:0,e:"Pred zmenou pruhu treba skontrolovať situáciu okolo vozidla a včas signalizovať."},
 {q:"Čo znamená STOP značka?",a:["Musíte úplne zastaviť.","Stačí spomaliť.","Zastavíte iba vtedy, keď ide iné auto."],c:0,e:"Pri značke STOP musíte úplne zastaviť a pokračovať až keď je to bezpečné."},
 {q:"Prečo je dôležité udržiavať bezpečnú vzdialenosť?",a:["Aby ste mali čas reagovať a zastaviť.","Aby ste mohli jazdiť rýchlejšie.","Aby vás ostatní vodiči nepredbehli."],c:0,e:"Bezpečný odstup poskytuje čas na reakciu a brzdenie."},
 {q:"Čo máte urobiť, keď sa približujete k priechodu pre chodcov a chodec chce prejsť?",a:["Spomaliť a zastaviť, ak je to potrebné, aby mohol bezpečne prejsť.","Zrýchliť, aby ste prešli ako prví.","Použiť iba klaksón."],c:0,e:"Chodcom treba umožniť bezpečne prejsť podľa pravidiel cestnej premávky."}
];

let state={screen:"home",i:0,score:0,wrong:[],answered:false};

function render(){
 const el=document.getElementById("app");
 if(state.screen==="home"){el.innerHTML=`
 <div class="card"><span class="badge">TRÉNING</span><h2>Priprav sa na DTT</h2><p class="muted">Krátky tréning s okamžitým vyhodnotením odpovedí.</p><button onclick="start()">▶️ Začať tréning</button><button class="secondary" onclick="showStats()">📊 Štatistiky</button></div>
 <div class="card"><h3>Čo bude aplikácia sledovať?</h3><div class="stat"><span>Správne odpovede</span><b id="hs">0</b></div><div class="stat"><span>Chyby</span><b>${state.wrong.length}</b></div></div>
 <p class="muted" style="font-size:12px">Prototyp – otázky sú ukážkové a nie sú prezentované ako oficiálna databáza RSA.</p>`}
 else if(state.screen==="quiz"){let q=questions[state.i]; el.innerHTML=`
 <div class="stat"><span>Otázka ${state.i+1}/${questions.length}</span><b>${state.score} ✓</b></div>
 <div class="progress"><div class="bar" style="width:${state.i/questions.length*100}%"></div></div>
 <div class="card"><h2>${q.q}</h2>${q.a.map((x,n)=>`<button class="answer" id="a${n}" onclick="answer(${n})">${String.fromCharCode(65+n)}. ${x}</button>`).join("")}</div>
 <div id="feedback"></div>`}
 else if(state.screen==="stats"){el.innerHTML=`
 <div class="card"><h2>📊 Tvoje štatistiky</h2><div class="big">${state.score}/${questions.length}</div><p class="muted">Správne v poslednom tréningu</p>
 <div class="stat"><span>Chyby celkom</span><b>${state.wrong.length}</b></div></div>
 <button onclick="start()">🔄 Opakovať tréning</button><button class="secondary" onclick="state.screen='home';render()">← Späť</button>`}
}
function start(){state.i=0;state.score=0;state.wrong=[];state.answered=false;state.screen="quiz";render()}
function answer(n){
 if(state.answered)return; state.answered=true; let q=questions[state.i];
 document.querySelectorAll(".answer").forEach((b,i)=>{if(i===q.c)b.classList.add("correct");if(i===n&&n!==q.c)b.classList.add("wrong")});
 if(n===q.c)state.score++;else state.wrong.push(state.i);
 document.getElementById("feedback").innerHTML=`<div class="card"><b>${n===q.c?"✅ Správne":"❌ Nesprávne"}</b><p>${q.e}</p><button onclick="next()">Ďalšia otázka →</button></div>`;
}
function next(){if(state.i<questions.length-1){state.i++;state.answered=false;render()}else{state.screen="stats";render()}}
function showStats(){state.screen="stats";render()}
render();
</script>
</body></html>
